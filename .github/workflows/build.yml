name: Build

# Manual only: releases are normally cut locally with Tools/release.sh (Developer ID + notarization).
# To run this in CI, add the secrets listed in RELEASING.md, then use "Run workflow".
on:
  workflow_dispatch:

jobs:
  developer-id:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          KEYCHAIN_PWD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain
          rm certificate.p12
      - name: Build, sign, notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./build.sh --universal --sign devid --notarize
      - uses: actions/upload-artifact@v4
        with:
          name: StardewCheckup-macos
          path: build/StardewCheckup-*.zip
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/StardewCheckup-*.zip
          generate_release_notes: true
      - name: Update Homebrew cask
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true      # needs a HOMEBREW_TAP_TOKEN secret (PAT with repo scope on homebrew-tap)
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh api repos/patbonecrusher/homebrew-tap/dispatches -f event_type=update-cask \
            -f "client_payload[version]=${GITHUB_REF#refs/tags/v}" -f "client_payload[cask]=stardew-checkup"
